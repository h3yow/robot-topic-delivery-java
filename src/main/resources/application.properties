server.port=0

# broker 配置
broker.queue-capacity-per-subscription=64
broker.ack-timeout-millis=500
broker.max-retries=3
broker.dispatch-interval-millis=5

# 失败留存（死信）
broker.dead-letter-capacity=1000
broker.overflow-policy=DROP_OLDEST

# 重试退避：0 表示立即重试（旧行为）；>0 时逐次按 multiplier 拉长，封顶 max
broker.retry-backoff-initial-millis=0
broker.retry-backoff-multiplier=2.0
broker.retry-backoff-max-millis=30000
