# 随机端口启动；本地联调时可改为固定端口。
server.port=0

# ===== 机器人主题可靠投递配置（前缀 robot.messaging）=====
# 每个订阅者待投递队列的默认容量。
robot.messaging.queue-capacity=128
# 队列饱和时的默认背压策略：BLOCK（阻塞发布方）/ REJECT（立即拒绝并回执原因）/ DROP_OLDEST（淘汰最旧待投递消息）。
robot.messaging.backpressure-policy=BLOCK
# 投递后等待订阅者确认的超时时间（毫秒）；超时后收回并重试。
robot.messaging.ack-timeout-millis=5000
# 每条消息对单个订阅者的最大投递尝试次数；达到后进入 DEAD(RETRIES_EXHAUSTED)。
robot.messaging.max-attempts=5
# 订阅者连接中断后的宽限期（毫秒）；宽限期内恢复则补投，超时未恢复则进入 DEAD(CONNECTION_LOST)。
robot.messaging.disconnect-grace-millis=30000
# 全局在途确认超时扫描的周期（毫秒）。
robot.messaging.timeout-scan-interval-millis=20
