server.port=0

# broker 配置
broker.queue-capacity-per-subscription=64
broker.ack-timeout-millis=500
broker.max-retries=3
broker.dispatch-interval-millis=5

# 重试退避：逐次变长的等待（0 表示立即重试，即旧行为）
broker.retry-backoff-initial-millis=100
broker.retry-backoff-multiplier=2.0
broker.retry-backoff-max-millis=5000

# 死信留存：重试耗尽终止的消息留存条数上限与溢出取舍策略
broker.dead-letter-capacity=256
broker.dead-letter-overflow-policy=EVICT_OLDEST
